# 用法（详见 README「Docker 部署」）：
#   cp .env.example .env     # 填好 SITE_URL、AUTH_SECRET、ADMIN_PASSWORD（站点在 Nginx 后面时再设 TRUST_PROXY=true）
#   docker compose up -d
# 默认拉取 GitHub 自动构建好的镜像（amd64 / arm64），不用在服务器上构建。
# 更新：docker compose pull && docker compose up -d
# 改了代码想自己构建：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 数据都在 ./docker-data 下（数据库、上传图片、备份），更新、重建容器不会丢。
services:
  app:
    # 想固定版本时在 .env 里设置 TUTORIAL_IMAGE=ghcr.io/vow132/tutorial-site:1.4.0
    image: ${TUTORIAL_IMAGE:-ghcr.io/vow132/tutorial-site:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/tutorial.db
    ports:
      # 只给本机的 Nginx / Caddy 反向代理用；不用反代、直接对外时改成 "3000:3000"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker-data/db:/app/data
      - ./docker-data/uploads:/app/public/uploads
      - ./docker-data/backups:/app/backups
