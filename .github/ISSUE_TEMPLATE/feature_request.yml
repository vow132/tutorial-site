name: 功能建议
description: 希望增加或改进的功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在用的时候遇到了什么不方便？谁会用到这个功能（站长、读者）？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 设想的做法
      description: 希望它怎么工作，可以画个草图或举其他网站的例子。
  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么绕过的
      description: 有没有临时办法，或者考虑过的其他做法。
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜过现有的 Issue，没有人提过这个建议
          required: true
        - label: 这个需求不能通过后台设置实现（见 docs/CUSTOMIZE.md）
          required: false
