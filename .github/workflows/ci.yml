name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Node 20 已停止维护；engines 要求 >=22.12，推荐生产环境使用 24 LTS
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      # CI 使用一次性 SQLite 文件数据库，验证完整构建链路
      DATABASE_URL: "file:./prisma/ci.db"
      AUTH_SECRET: "ci-only-never-use-in-production"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ci-admin-password"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npx prisma generate

      - name: 数据库迁移
        run: npx prisma migrate deploy

      - name: 写入种子数据
        run: npx prisma db seed

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      # 端到端测试只在一个 Node 版本上跑：浏览器安装和测试本身与 Node 版本无关。
      - name: 安装 Playwright 浏览器
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        if: matrix.node-version == 24
        run: npm run test:e2e

      - name: 上传端到端测试失败现场
        if: failure() && matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Docker 镜像能构建，第一次启动能建库，页面用的是运行时的 SITE_URL 和真实数据（不是构建时的空库），重启不会重复写入示例数据。
  # 两种架构的构建和发布在 docker-publish.yml。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建镜像
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org/ --build-arg BUILD_REVISION="$GITHUB_SHA" -t tutorial-site:ci .

      - name: 冒烟测试
        run: bash .github/scripts/docker-smoke.sh tutorial-site:ci

  # 依赖出现高危漏洞时单独标红，不影响上面的构建结果判断。
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm audit（生产依赖）
        run: npm audit --omit=dev --audit-level=high --package-lock-only
