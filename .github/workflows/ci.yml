name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI 使用一次性 SQLite 文件数据库，验证完整构建链路
      DATABASE_URL: "file:./prisma/ci.db"
      AUTH_SECRET: "ci-only-never-use-in-production"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ci-admin-password"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npx prisma generate

      - name: 数据库迁移
        run: npx prisma migrate deploy

      - name: 写入种子数据
        run: npx prisma db seed

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

  # 依赖出现高危漏洞时单独标红，不影响上面的构建结果判断。
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit（生产依赖）
        run: npm audit --omit=dev --audit-level=high --package-lock-only
