name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Node 20 已停止维护；engines 要求 >=22.12，推荐生产环境使用 24 LTS
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      # CI 使用一次性 SQLite 文件数据库，验证完整构建链路
      DATABASE_URL: "file:./prisma/ci.db"
      AUTH_SECRET: "ci-only-never-use-in-production"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ci-admin-password"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma 客户端
        run: npx prisma generate

      - name: 数据库迁移
        run: npx prisma migrate deploy

      - name: 写入种子数据
        run: npx prisma db seed

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      # 端到端测试只在一个 Node 版本上跑：浏览器安装和测试本身与 Node 版本无关。
      - name: 安装 Playwright 浏览器
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        if: matrix.node-version == 24
        run: npm run test:e2e

      - name: 上传端到端测试失败现场
        if: failure() && matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Docker 镜像能构建、第一次启动能建库，并且页面是按真实数据生成的（不是构建时的空库）。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建镜像
        run: docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org/ -t tutorial-site:ci .

      - name: 启动容器并检查
        run: |
          docker run -d --name site -p 3000:3000 \
            -e AUTH_SECRET=ci-docker-only-never-use-in-production \
            -e ADMIN_PASSWORD=ci-admin-password \
            tutorial-site:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/ | grep -q "Flexbox"
          test "$(curl -sf http://127.0.0.1:3000/sitemap.xml | grep -c '<url>')" -gt 2
          # 重启后不会重复写入种子数据
          docker restart site
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          test "$(docker logs site 2>&1 | grep -c '第一次启动')" -eq 1

      - name: 容器日志
        if: always()
        run: docker logs site

  # 依赖出现高危漏洞时单独标红，不影响上面的构建结果判断。
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm audit（生产依赖）
        run: npm audit --omit=dev --audit-level=high --package-lock-only
