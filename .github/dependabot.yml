# 每周检查依赖与 GitHub Actions 的安全更新，自动开 PR。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint（eslint-config-next 依赖）尚不支持 TypeScript 7，升级会让 lint 直接崩溃
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node 类型定义要与 engines 的最低版本（Node 22）一致，避免用到旧版没有的 API
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
